<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>냉키트 로그인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <h1 class="login-title">LOGIN</h1>

    <input id="userId" class="login-input" type="text" placeholder="아이디" />
    <input id="userPw" class="login-input" type="password" placeholder="비밀번호" />

    <button class="login-next-btn" onclick="login()">→</button>

    <p class="login-help">아이디 / 비밀번호를 잊으셨나요?</p>

    <div class="login-links">
      <a href="#">회원가입</a>
      <span>OR</span>
      <a href="#" onclick="skipLogin()">건너뛰기</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
