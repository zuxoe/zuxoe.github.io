<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉키트 - 로그인</title>
    <style>
        body { font-family: sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-wrapper { width: 100%; max-width: 480px; min-height: 95vh; border: 2px dashed #999; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .login-title { font-size: 64px; font-weight: 900; letter-spacing: -2px; margin-bottom: 40px; }
        .input-group { width: 85%; margin-bottom: 15px; }
        input { width: 100%; padding: 15px; border: 2px solid #333; font-size: 16px; box-sizing: border-box; }
        .arrow-btn { width: 60px; height: 40px; background: #e0e0e0; border: 2px solid #333; border-radius: 10px; font-size: 20px; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .arrow-btn:hover { background: #ccc; }
        .footer-links { margin-top: 60px; font-size: 13px; color: #444; text-align: center; line-height: 1.6; }
        .find-text { color: #666; cursor: pointer; text-decoration: underline; margin-bottom: 8px; font-weight: bold; }
        .or-text { font-size: 12px; color: #999; margin: 10px 0; }
        .action-links span { text-decoration: underline; cursor: pointer; margin: 0 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <div class="login-title">LOGIN</div>
    
    <div class="input-group">
        <input type="text" id="username" placeholder="아이디">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="비밀번호">
    </div>

    <button class="arrow-btn" onclick="login()">➔</button>

    <div class="footer-links">
        <div class="find-text" onclick="alert('🔒 기능 준비 중!')">아이디/비밀번호를 잊으셨나요?</div>
        <div class="or-text">──────── OR ────────</div>
        <div class="action-links">
            <span onclick="alert('📝 회원가입 준비 중!')">회원가입</span>
            <span onclick="skipLogin()">건너뛰기</span>
        </div>
    </div>
</div>

<script>
    function login() {
        const user = document.getElementById('username').value.trim();
        const pw = document.getElementById('password').value.trim();
        if (user === "" || pw === "") {
            alert("아이디와 비밀번호를 입력해주세요!");
            return;
        }
        localStorage.setItem('nkUser', user);
        location.href = 'survey.html'; // survey.html로 정확하게 이동
    }

    function skipLogin() {
        localStorage.setItem('nkUser', '게스트');
        location.href = 'survey.html';
    }
</script>

</body>
</html>
