<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>냉키트 로그인</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      border: 5px dashed #aaa;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 650px;
      max-width: 90%;
      text-align: center;
    }

    h1 {
      font-size: 110px;
      margin: 0 0 40px;
      font-family: Impact, Arial Black, sans-serif;
      letter-spacing: 4px;
    }

    input {
      display: block;
      width: 100%;
      height: 70px;
      margin-bottom: 35px;
      padding: 0 25px;
      border: 5px solid #666;
      font-size: 28px;
      font-weight: bold;
      outline: none;
    }

    button {
      width: 120px;
      height: 65px;
      border: none;
      border-radius: 15px;
      background: #e8e8e8;
      font-size: 50px;
      cursor: pointer;
    }

    .help {
      margin-top: 90px;
      color: #999;
      font-size: 24px;
      font-weight: bold;
    }

    .links {
      margin-top: 30px;
      color: #999;
      font-size: 24px;
      font-weight: bold;
    }

    .links a {
      color: #999;
      margin: 0 12px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>LOGIN</h1>

    <input id="id" type="text" placeholder="아이디">
    <input id="pw" type="password" placeholder="비밀번호">

    <button onclick="login()">→</button>

    <div class="help">아이디 / 비밀번호를 잊으셨나요?</div>

    <div class="links">
      <a>회원가입</a>
      <span>OR</span>
      <a onclick="goSurvey()">건너뛰기</a>
    </div>
  </div>

  <script>
    function login() {
      const id = document.getElementById("id").value;
      const pw = document.getElementById("pw").value;

      if (id === "" || pw === "") {
        alert("아이디와 비밀번호를 입력해주세요.");
        return;
      }

      location.href = "survey.html";
    }

    function goSurvey() {
      location.href = "survey.html";
    }
  </script>
</body>
</html>
