<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉키트 - 설문 입력</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; margin: 0; }
        .wrapper { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; border: 1px solid #ddd; display: flex; flex-direction: column; }
        
        /* 상단 헤더 */
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .menu-icon, .home-icon { font-size: 24px; cursor: pointer; }
        .logo { font-size: 24px; font-weight: bold; color: #ffcc00; text-shadow: 1px 1px 1px #000; cursor: pointer; }

        .container { padding: 20px; flex: 1; }
        h2 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #111; }
        
        /* 설문 섹션 및 점선 분리선 */
        section { margin-bottom: 25px; }
        .divider { border: 0; border-top: 1px dotted #aaa; margin: 25px 0; }

        /* 라디오 버튼 그룹 레이아웃 (손그림 매칭) */
        .filter-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        .filter-row { display: flex; align-items: flex-start; line-height: 1.4; }
        .filter-label { width: 85px; font-weight: bold; color: #000; font-size: 14px; flex-shrink: 0; }
        .filter-options { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
        .filter-options label { font-size: 13px; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 3px; margin-right: 4px; }

        /* 입력창 스타일 */
        .input-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333; }
        input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 2px solid #333; border-radius: 4px; font-size: 14px; }
        .sub-desc { font-size: 11px; color: #888; margin-top: 5px; }

        .taste-block { margin-bottom: 15px; }

        /* 하단 네비게이션 바 */
        footer { padding: 15px 20px; display: flex; justify-content: space-between; border-top: 1px solid #eee; background: #fff; margin-top: auto; }
        .nav-btn { padding: 10px 22px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .next-btn { background: #ffe4e1; border: 1px solid #ffb6c1; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div class="menu-icon">☰</div>
        <div class="logo" onclick="location.href='login.html'">냉키트 😋</div>
        <div class="home-icon" onclick="location.href='login.html'">🏠</div>
