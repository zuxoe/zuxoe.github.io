<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉키트 - 로그인 및 입력</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; margin: 0; }
        .wrapper { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; border: 1px solid #ddd; display: flex; flex-direction: column; }
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: bold; color: #ffcc00; text-shadow: 1px 1px 1px #000; }
        section { padding: 20px; border-bottom: 1px dotted #ccc; }
        .row { margin-bottom: 12px; }
        .options label { margin-right: 10px; font-size: 14px; cursor: pointer; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        footer { margin-top: auto; padding: 20px; display: flex; justify-content: space-between; }
        .nav-btn { padding: 10px 20px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 20px; font-weight: bold; }
        .next-btn { background: #ffe4e1; border: none; width: 100%; padding: 15px; font-size: 16px; }
        
        /* 로그인 화면 전용 스타일 */
        .login-container { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; gap: 15px; justify-content: center; flex: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <span>☰</span>
        <div class="logo" onclick="location.reload()" style="cursor:pointer;">냉키트 😋</div>
        <span>🏠</span>
    </header>

    <div id="loginPage" class="login-container">
        <h2 style="font-size: 28px; margin-bottom: 20px;">🔑 로그인</h2>
        <div style="text-align: left;">
            <label>아이디</label>
            <input type="text" id="userId" placeholder="아무 아이디나 입력하세요">
        </div>
        <div style="text-align: left;">
            <label>비밀번호</label>
            <input type="password" id="userPw" placeholder="비밀번호를 입력하세요">
        </div>
        <button class="nav-btn next-btn" style="margin-top: 20px;" onclick="checkLogin()">로그인하기</button>
    </div>

    <div id="mainPage" class="hidden">
        <section style="background: #f9f9f9; padding: 10px 20px;">
            <span id="welcomeMsg" style="font-weight: bold; color: #333;"></span>님 환영합니다!
        </section>
        
        <section>
            <h2>1. 어떤 요리를 만들고 싶으신가요?</h2>
            <div class="row">
                <strong>&lt;종류&gt;</strong>
                <div class="options">
                    <label><input type="radio" name="foodCategory" value="한식" checked> 한식</label>
                    <label><input type="radio" name="foodCategory" value="일식"> 일식</label>
                    <label><input type="radio" name="foodCategory" value="중식"> 중식</label>
                    <label><input type="radio" name="foodCategory" value="양식"> 양식</label>
                    <label><input type="radio" name="foodCategory" value="디저트"> 디저트</label>
                </div>
            </div>
        </section>

        <section>
            <h2>2. 사용할 재료를 입력해주세요.</h2>
            <input type="text" id="ing" placeholder="예: 양파, 계란">
        </section>

        <footer>
            <button class="nav-btn" onclick="location.reload()">로그아웃</button>
            <button class="nav-btn next-btn" style="width: auto;" onclick="saveAndNext()">다음 →</button>
        </footer>
    </div>
</div>

<script>
    // 1. 로그인 버튼 눌렀을 때 작동하는 함수
    function checkLogin() {
        const id = document.getElementById('userId').value.trim();
        const pw = document.getElementById('userPw').value.trim();

        // 아이디와 비밀번호가 비어있는지 확인
        if (id === "" || pw === "") {
            alert("아이디와 비밀번호를 모두 입력해주세요!");
            return;
        }

        // 로그인 성공 처리 (따로 서버가 없으므로 입력만 하면 통과시킵니다)
        document.getElementById('welcomeMsg').innerText = id; // 유저 아이디 표시
        
        // 로그인창 숨기고 메인화면 보여주기
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
    }

    // 2. 레시피 보러가기 버튼 눌렀을 때 작동하는 함수
    function saveAndNext() {
        const choice = document.querySelector('input[name="foodCategory"]:checked').value;
        const ingredients = document.getElementById('ing').value;

        // 브라우저 메모리에 저장
        localStorage.setItem('userChoice', choice);
        localStorage.setItem('userIng', ingredients);

        // 결과 페이지(recipe.html)로 이동
        location.href = 'recipe.html';
    }
</script>

</body>
</html>
