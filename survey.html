<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>냉키트 세부 선택</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      height: 120px;
      border-bottom: 3px dotted #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    .menu,
    .home {
      font-size: 45px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .logo {
      font-size: 58px;
      font-weight: bold;
      color: #222;
    }

    .logo span:nth-child(1) {
      color: #ffd233;
    }

    .logo span:nth-child(2) {
      color: #66b8ff;
    }

    .logo span:nth-child(3) {
      color: #18a542;
    }

    section {
      padding: 25px 45px;
      border-bottom: 3px dotted #ddd;
    }

    h2 {
      font-size: 28px;
      margin: 0 0 25px;
    }

    .option-line {
      display: grid;
      grid-template-columns: 120px repeat(5, 1fr);
      gap: 18px;
      align-items: center;
      margin: 20px 0;
      font-size: 23px;
    }

    label {
      cursor: pointer;
      white-space: nowrap;
    }

    input[type="radio"] {
      width: 18px;
      height: 18px;
      margin-right: 5px;
    }

    .text-input {
      width: 85%;
      height: 60px;
      display: block;
      margin: 0 auto;
      border: 4px solid #666;
      font-size: 24px;
      padding: 0 15px;
      outline: none;
    }

    .hint {
      width: 85%;
      margin: 10px auto 0;
      color: #aaa;
      font-size: 18px;
    }

    .taste-box {
      width: 65%;
      margin-left: 80px;
    }

    .taste-box p {
      font-size: 23px;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    .small-input {
      width: 100%;
      height: 45px;
      border: 3px solid #666;
      font-size: 21px;
      padding: 0 12px;
      outline: none;
    }

    footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-between;
      padding: 15px 25px;
    }

    footer button {
      border: none;
      border-radius: 12px;
      background: #e8e8e8;
      padding: 10px 25px;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .option-line {
        grid-template-columns: 1fr 1fr;
      }

      .option-line strong {
        grid-column: 1 / 3;
      }

      .taste-box,
      .text-input,
      .hint {
        width: 100%;
        margin-left: 0;
      }

      .logo {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <button class="menu">☰</button>
      <div class="logo">
        <span>냉</span><span>키</span><span>트</span> ＞＜
      </div>
      <button class="home" onclick="location.href='index.html'">⌂</button>
    </header>

    <section>
      <h2>1. 어떤 요리를 만들고 싶으신가요?</h2>

      <div class="option-line">
        <strong>&lt; 종류 &gt;</strong>
        <label><input type="radio" name="type" value="한식">한식</label>
        <label><input type="radio" name="type" value="일식">일식</label>
        <label><input type="radio" name="type" value="중식">중식</label>
        <label><input type="radio" name="type" value="양식">양식</label>
        <label><input type="radio" name="type" value="디저트">디저트</label>
      </div>

      <div class="option-line">
        <strong>&lt; 상황 &gt;</strong>
        <label><input type="radio" name="situation" value="다이어트">다이어트</label>
        <label><input type="radio" name="situation" value="야식">야식</label>
        <label><input type="radio" name="situation" value="안주">안주</label>
        <label><input type="radio" name="situation" value="초스피드">초스피드</label>
        <label><input type="radio" name="situation" value="손님접대">손님접대</label>
      </div>

      <div class="option-line">
        <strong>&lt; 건강 &gt;</strong>
        <label><input type="radio" name="health" value="위건강">위건강</label>
        <label><input type="radio" name="health" value="장건강">장건강</label>
        <label><input type="radio" name="health" value="혈당조절">혈당조절</label>
        <label><input type="radio" name="health" value="간건강">간건강</label>
        <label><input type="radio" name="health" value="혈액순환">혈액순환</label>
      </div>

      <div class="option-line">
        <strong>&lt; 방법 &gt;</strong>
        <label><input type="radio" name="method" value="볶음">볶음</label>
        <label><input type="radio" name="method" value="끓이기">끓이기</label>
        <label><input type="radio" name="method" value="비빔">비빔</label>
        <label><input type="radio" name="method" value="굽기">굽기</label>
        <label><input type="radio" name="method" value="삶기">삶기</label>
      </div>
    </section>

    <section>
      <h2>2. 사용할 재료를 입력해주세요.</h2>
      <input id="ingredients" class="text-input" type="text" placeholder="예: 김치, 계란, 밥">
      <div class="hint">* 2개 이상의 재료는 쉼표로 구분해 주세요.</div>
    </section>

    <section>
      <h2>3. 세부적인 음식 취향을 입력해주세요.</h2>

      <div class="taste-box">
        <p>- 싫어하는 식감</p>
        <input id="texture" class="small-input" type="text" placeholder="예: 물컹한 식감">

        <p>- 싫어하는 식재료</p>
        <input id="hate" class="small-input" type="text" placeholder="예: 오이, 버섯">

        <p>- 선호하는 맵기 정도</p>
        <input id="spicy" class="small-input" type="text" placeholder="예: 안 매운맛, 보통, 매운맛">
      </div>
    </section>

    <footer>
      <button onclick="location.href='index.html'">← 이전</button>
      <button onclick="goResult()">다음 →</button>
    </footer>
  </div>

  <script>
    function getRadioValue(name) {
      const checked = document.querySelector("input[name='" + name + "']:checked");
      return checked ? checked.value : "";
    }

    function goResult() {
      const type = getRadioValue("type");
      const situation = getRadioValue("situation");
      const health = getRadioValue("health");
      const method = getRadioValue("method");
      const ingredients = document.getElementById("ingredients").value;
      const texture = document.getElementById("texture").value;
      const hate = document.getElementById("hate").value;
      const spicy = document.getElementById("spicy").value;

      localStorage.setItem("type", type);
      localStorage.setItem("situation", situation);
      localStorage.setItem("health", health);
      localStorage.setItem("method", method);
      localStorage.setItem("ingredients", ingredients);
      localStorage.setItem("texture", texture);
      localStorage.setItem("hate", hate);
      localStorage.setItem("spicy", spicy);

      location.href = "result.html";
    }
  </script>
</body>
</html>
