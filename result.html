<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>냉키트 - 추천결과</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f9f9fb;
            --border-dark: #333333;
            --accent-pink: #ffe4e1;
        }
        body { font-family: sans-serif; background-color: #f5f5f5; margin: 0; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 480px; background-color: var(--bg-color); min-height: 100vh; border-left: 1px solid #ddd; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding-bottom: 30px; }
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
        .logo span:nth-child(1) { color: #FFC107; }
        .logo span:nth-child(2) { color: #2196F3; }
        .logo span:nth-child(3) { color: #4CAF50; }
        .user-info-bar { background-color: #fdf8e2; padding: 10px 20px; font-size: 13px; border-bottom: 1px solid #eee; color: #555; }
        .recipe-list { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .recipe-card { display: flex; border: 2px solid var(--border-dark); border-radius: 4px; background-color: var(--card-bg); padding: 10px; position: relative; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .bookmark { position: absolute; top: 5px; right: 8px; color: #ff9800; font-size: 20px; }
        .img-placeholder { width: 100px; height: 100px; border: 1px solid var(--border-dark); background-color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .recipe-info { margin-left: 15px; flex: 1; display: flex; flex-direction: column; }
        .recipe-title { font-size: 18px; font-weight: bold; margin: 0 0 8px 0; }
        .stars { color: #ffeb3b; text-shadow: 1px 1px 0 #000; font-size: 14px; margin-left: 5px; }
        .recipe-details { font-size: 12px; line-height: 1.5; color: #333; margin: 2px 0; }
        .btn-group { margin-top: auto; display: flex; justify-content: flex-end; gap: 5px; }
        .btn { padding: 4px 8px; font-size: 11px; font-weight: bold; border: 1px solid var(--border-dark); background-color: var(--accent-pink); cursor: pointer; border-radius: 2px; }
        .btn-end { background-color: #fff; }
        .back-btn { margin: 20px; padding: 12px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
