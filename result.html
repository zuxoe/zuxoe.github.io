<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉키트 - 추천결과</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f9f9fb;
            --border-dark: #333333;
            --accent-pink: #ffe4e1;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        /* 헤더 */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
        .logo span:nth-child(1) { color: #FFC107; }
        .logo span:nth-child(2) { color: #2196F3; }
        .logo span:nth-child(3) { color: #4CAF50; }

        .user-info-bar {
            background-color: #fdf8e2;
            padding: 10px 20px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        /* 레시피 리스트 */
        .recipe-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .recipe-card {
            display: flex;
            border: 2px solid var(--border-dark);
            border-radius: 4px;
            background-color: var(--card-bg);
            padding: 10px;
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .bookmark {
            position: absolute;
            top: 5px;
            right: 8px;
            color: #ff9800;
            font-size: 20px;
        }

        .img-placeholder {
            width: 100px;
            height: 100px;
            border: 1px solid var(--border-dark);
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .recipe-info {
            margin-left: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .stars { color: #ffeb3b; text-shadow: 1px 1px 0 #000; font-size: 14px; margin-left: 5px; }

        .recipe-details {
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            margin: 2px 0;
        }

        .btn-group {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        .btn {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--border-dark);
            background-color: var(--accent-pink);
            cursor: pointer;
            border-radius: 2px;
        }

        .btn-end { background-color: #fff; }

        .back-btn {
            margin: 20px;
            padding: 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div style="font-size:24px; cursor:pointer;">☰</div>
        <a href="index.html" class="logo">
            <span>냉</span><span>키</span><span>트</span>
        </a>
        <div onclick="location.href='index.html'" style="font-size:24px; cursor:pointer;">🏠</div>
    </header>

    <div class="user-info-bar" id="userInfo">
        선택한 종류: 가져오는 중...
    </div>

    <div id="list" class="recipe-list"></div>

    <button class="back-btn" onclick="location.href='index.html'">← 다시 골라볼래요</button>
</div>

<script>
    // 1. 대폭 확장된 음식 데이터베이스 (여기에 원하는 요리를 계속 추가하시면 됩니다!)
    const recipes = {
        "한식": [
            { name: "김치찌개", star: "⭐", ing: "김치, 돼지고기, 두부, 대파", method: "보글보글 끓이기" },
            { name: "김치만두", star: "⭐⭐⭐", ing: "김치, 다진고기, 만두피, 당면", method: "찜기에 푹 찌기" },
            { name: "김치찜", star: "⭐⭐", ing: "묵은지, 돼지 앞다리살, 양파", method: "약불로 오래 조리기" },
            { name: "제육볶음", star: "⭐⭐⭐", ing: "돼지고기, 고추장, 양파, 대파", method: "센 불에 빠르게 볶기" },
            { name: "된장찌개", star: "⭐", ing: "된장, 두부, 애호박, 차돌박이", method: "뚝배기에 끓이기" },
            { name: "비빔밥", star: "⭐⭐", ing: "밥, 고추장, 계란, 각종 나물류", method: "참기름 넣고 비비기" }
        ],
        "일식": [
            { name: "연어초밥", star: "⭐⭐⭐", ing: "연어 필렛, 단초물 밥, 와사비", method: "한입 크기로 뭉쳐서 올리기" },
            { name: "돈카츠", star: "⭐⭐", ing: "돼 등심, 빵가루, 계란, 밀가루", method: "바삭하게 튀겨내기" },
            { name: "돈코츠 라멘", star: "⭐⭐⭐", ing: "라멘 생면, 차슈, 사골 육수", method: "면을 삶고 육수 붓기" },
            { name: "규동(소고기덮밥)", star: "⭐", ing: "우삼겹, 양파, 쯔유 소스, 계란", method: "소스에 졸여 밥 위에 얹기" },
            { name: "야키소바", star: "⭐⭐", ing: "면, 양배추, 삼겹살, 야키소바 소스", method: "철판에 달달 볶기" }
        ],
        "중식": [
            { name: "짜장면", star: "⭐⭐⭐", ing: "중화면, 춘장, 돼지고기, 양파", method: "춘장을 볶아 면 위에 얹기" },
            { name: "짬뽕", star: "⭐⭐", ing: "중화면, 고춧가루, 오징어, 홍합, 배추", method: "불맛 나게 볶아 끓이기" },
            { name: "탕수육", star: "⭐⭐⭐", ing: "돼지고기, 전분가루, 소스용 야채", method: "바삭하게 튀겨 소스 붓기/찍기" },
            { name: "마파두부", star: "⭐", ing: "두부, 다진고기, 두반장, 전분물", method: "매콤하게 졸여내기" },
            { name: "멘보샤", star: "⭐⭐⭐", ing: "식빵, 다진 새우, 계란흰자", method: "낮은 온도 식빵 튀기기" }
        ],
        "양식": [
            { name: "알리오 올리오", star: "⭐", ing: "파스타면, 마늘, 올리브유, 페페론치노", method: "오일에 마늘향 내어 볶기" },
            { name: "까르보나라", star: "⭐⭐", ing: "파스타면, 베이컨, 계란노른자, 치즈가루", method: "불을 끄고 소스 잔열로 비비기" },
            { name: "토마토 미트볼 스파게티", star: "⭐⭐", ing: "파스타면, 토마토소스, 다진고기 완자", method: "소스와 면을 함께 졸이기" },
            { name: "티본 스테이크", star: "⭐⭐⭐", ing: "티본 소고기, 버터, 로즈마리, 마늘", method: "팬에 시어링하며 굽기" },
            { name: "고르곤졸라 피자", star: "⭐", ing: "또또아/피자도우, 고르곤졸라 치즈, 꿀", method: "오븐이나 에어프라이어 구우면 끝" }
        ],
        "디저트": [
            { name: "크로플", star: "⭐⭐⭐", ing: "크로와상 생지, 메이플 시럽, 아이스크림", method: "와플 팬에 바삭하게 누르기" },
            { name: "초코 브라우니", star: "⭐⭐", ing: "다크 초콜릿, 버터, 밀가루, 계란", method: "반죽을 섞어 오븐에 굽기" },
            { name: "프렌치 토스트", star: "⭐", ing: "식빵, 계란, 우유, 설탕, 버터", method: "계란물 적셔 팬에 굽기" }
        ]
    };

    // 2. index.html에서 저장한 사용자의 선택 값 가져오기
    const userChoice = localStorage.getItem('userChoice') || "한식";
    const userIng = localStorage.getItem('userIng') || "없음";

    // 상단 안내 바 업데이트
    document.getElementById('userInfo').innerHTML = `💡 <strong>${userChoice}</strong> 카테고리 | 내가 가진 재료: <span style="color:#e91e63;">${userIng}</span>`;

    // 3. 필터링된 결과 화면에 꽂아주기
    const listDiv = document.getElementById('list');
    const selectedList = recipes[userChoice] || [];

    if (selectedList.length === 0) {
        listDiv.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">준비된 레시피가 없습니다.</div>';
    } else {
        selectedList.forEach(item => {
            listDiv.innerHTML += `
                <div class="recipe-card">
                    <div class="bookmark">🔖</div>
                    <div class="img-placeholder">음식 사진</div>
                    <div class="recipe-info">
                        <h3 class="recipe-title">${item.name} <span class="stars">${item.star}</span></h3>
                        <p class="recipe-details"><strong>필요 재료 :</strong> ${item.ing}</p>
                        <p class="recipe-details"><strong>기본 조리법 :</strong> ${item.method}</p>
                        <p class="recipe-details" style="color:#888; font-size:11px;">(내가 가진 재료 <strong>"${userIng}"</strong> 활용 가능!)</p>
                        <div class="btn-group">
                            <button class="btn">조리 시작</button>
                            <button class="btn btn-end">조리 종료</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
